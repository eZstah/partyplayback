<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>youple.tv</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/32.png" alt=""><span>youple.tv</span></header>

  <section id="video" hidden>
    <div class="video"><img id="video-thumb" alt=""><p id="video-title"></p></div>
  </section>
  <p id="no-video" class="hint" hidden>Open a YouTube video to send it here. On YouTube you can also hover a thumbnail and click the cat.</p>

  <section id="rooms-section" hidden>
    <h2>Send to</h2>
    <ul id="rooms" role="radiogroup" aria-label="Room"></ul>
  </section>
  <section id="empty" hidden>
    <p class="hint">No rooms yet. Open one of your youple rooms once and it will show up here.</p>
  </section>

  <button id="send" type="button" class="primary" hidden></button>
  <p id="status" role="status"></p>
  <a id="site" href="https://youple.tv/" target="_blank">Open youple.tv</a>
  <script src="popup.js" type="module"></script>
</body>
</html>
